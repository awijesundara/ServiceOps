# Opt-in zero-downtime deployment topology: two app slots (blue/green)
# behind an nginx reverse proxy that owns the public port, plus the same
# db/worker services as compose.yaml. Use `./serviceops deploy <image>`
# (tools/blue_green_deploy.sh) to roll a new version into the currently
# idle slot, health-check it directly (bypassing nginx), then cut nginx
# over to it with a graceful `nginx -s reload` -- no dropped connections,
# and the previous slot stays running for an instant `./serviceops
# rollback` (tools/blue_green_rollback.sh) that's just another reload
# pointed at the old slot. Requires SERVICEOPS_IMAGE_BLUE,
# SERVICEOPS_IMAGE_GREEN, and ACTIVE_APP_SLOT (blue|green) in .env --
# `./serviceops deploy` bootstraps these from a plain compose.yaml install
# on first use. See serviceops-notes/docs/DEPLOYMENT.md for the full
# walkthrough.
name: serviceops

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-serviceops}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-serviceops}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
  DEPLOYMENT_PROFILE: production
  INSTANCE_NAME: ${INSTANCE_NAME:-ServiceOps}
  COMPANY_NAME: ${COMPANY_NAME:-Your Company}
  BRAND_TEAL: ${BRAND_TEAL:-#003e4c}
  BRAND_AMBER: ${BRAND_AMBER:-#f9aa3c}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
  AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:-}
  AUDIT_INTEGRITY_KEY_FILE: ${AUDIT_INTEGRITY_KEY_FILE:-}
  API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-}
  LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
  CSRF_ENABLED: ${CSRF_ENABLED:-true}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  ALLOW_INSECURE_SESSION_COOKIES: ${ALLOW_INSECURE_SESSION_COOKIES:-false}
  SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
  AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
  LDAP_ENABLED: ${LDAP_ENABLED:-false}
  LDAP_SERVER_URI: ${LDAP_SERVER_URI:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-}
  LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(&(objectClass=user)(sAMAccountName={username}))}
  LDAP_START_TLS: ${LDAP_START_TLS:-true}
  LDAP_VALIDATE_CERT: ${LDAP_VALIDATE_CERT:-true}
  LDAP_CA_CERT: ${LDAP_CA_CERT:-}
  LDAP_ROLE_MAPPINGS: ${LDAP_ROLE_MAPPINGS:-{}}
  KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
  KEYCLOAK_DISCOVERY_URL: ${KEYCLOAK_DISCOVERY_URL:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
  KEYCLOAK_ROLE_MAPPINGS: ${KEYCLOAK_ROLE_MAPPINGS:-{}}
  UPLOAD_FOLDER: /app/uploads
  LOG_DIR: /app/logs

x-app-common: &app-common
  build:
    context: .
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
  volumes:
    - serviceops_uploads:/app/uploads
    - serviceops_logs:/app/logs
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
    interval: 10s
    timeout: 5s
    retries: 12
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serviceops}
      POSTGRES_USER: ${POSTGRES_USER:-serviceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - serviceops_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serviceops} -d ${POSTGRES_DB:-serviceops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb

  app_blue:
    <<: *app-common
    image: ${SERVICEOPS_IMAGE_BLUE:?Set SERVICEOPS_IMAGE_BLUE in .env}
    environment: *app-env

  app_green:
    <<: *app-common
    image: ${SERVICEOPS_IMAGE_GREEN:?Set SERVICEOPS_IMAGE_GREEN in .env}
    environment: *app-env

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    environment:
      ACTIVE_APP_SLOT: app_${ACTIVE_APP_SLOT:-blue}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      - app_blue
      - app_green
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=16m,mode=1777
      - /etc/nginx/conf.d:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  worker:
    <<: *app-common
    # Tracks whichever slot is currently active -- tools/blue_green_deploy.sh
    # updates this alongside ACTIVE_APP_SLOT on every successful cutover, so
    # the worker always runs the same code version as the traffic-serving
    # slot rather than whichever was deployed first.
    image: ${SERVICEOPS_IMAGE_ACTIVE:?Set SERVICEOPS_IMAGE_ACTIVE in .env}
    command: ["python", "-m", "tools.outbox_worker"]
    environment:
      <<: *app-env
      AUTO_MIGRATE: "false"
      UPLOAD_FOLDER: /tmp/uploads
    healthcheck:
      disable: true
    depends_on:
      - app_blue
      - app_green

volumes:
  serviceops_data:
    name: serviceops_postgres_data
  serviceops_uploads:
    name: serviceops_uploads
  serviceops_logs:
    name: serviceops_logs
