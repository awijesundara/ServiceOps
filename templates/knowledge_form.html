{% extends "base.html" %}{% block title %}New knowledge article · {{ instance_name }}{% endblock %}
{% block content %}<header class="page-head"><div><p class="eyebrow">KNOWLEDGE</p><h1>New article</h1></div></header><form method="post" class="panel form-grid"><label class="wide">Title<input name="title" required></label><label>Category<input name="category" value="General" required></label><label class="wide">Content<textarea name="body" rows="14" required></textarea></label><div class="wide actions"><a class="button" href="{{ url_for('knowledge') }}">Cancel</a><button class="primary">Publish</button></div></form>{% endblock %}
