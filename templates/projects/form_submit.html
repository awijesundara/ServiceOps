{% extends "base.html" %}{% block title %}{{ form.name }} · {{ project.name }}{% endblock %}
{% block content %}{% include "projects/_header.html" %}<article class="panel"><h2>{{ form.name }}</h2><p>{{ form.description }}</p><form method="post" class="stack"><label>{{ tr('Summary') }}<input name="title" required maxlength="255"></label><label>{{ tr('Description') }}<textarea name="description" rows="5" maxlength="50000"></textarea></label>
{% for field in form.config.fields %}<label>{{ field.label }}{% if field.required %} *{% endif %}
{% if field.type in ['choice','multi_choice','boolean'] %}<select name="answer_{{ field.key }}" {% if field.type=='multi_choice' %}multiple{% endif %} {% if field.required %}required{% endif %}><option value="">{{ tr('Select') }}</option>{% if field.type=='boolean' %}<option value="true">{{ tr('Yes') }}</option><option value="false">{{ tr('No') }}</option>{% else %}{% for choice in field.choices %}<option>{{ choice }}</option>{% endfor %}{% endif %}</select>
{% elif field.type=='paragraph' %}<textarea name="answer_{{ field.key }}" rows="4" maxlength="10000" {% if field.required %}required{% endif %}></textarea>
{% else %}<input name="answer_{{ field.key }}" type="{{ 'number' if field.type in ['integer','number'] else 'date' if field.type=='date' else 'text' }}" {% if field.type=='number' %}step="any"{% elif field.type=='integer' %}step="1"{% endif %} maxlength="2000" {% if field.required %}required{% endif %}>{% endif %}</label>{% endfor %}<button class="primary">{{ tr('Create work item') }}</button></form></article>{% endblock %}
