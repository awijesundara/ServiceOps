<form method="post" class="stack" data-intake-editor>
{% if entry %}<input type="hidden" name="id" value="{{ entry.id }}"><input type="hidden" name="revision" value="{{ entry.revision }}">{% endif %}
<label>{{ tr('Name') }}<input name="name" required maxlength="100" value="{{ entry.name if entry else '' }}"></label>
<label>{{ tr('Description') }}<textarea name="description" rows="3" maxlength="10000">{{ entry.description if entry else '' }}</textarea></label>
<label><input type="checkbox" name="enabled" value="1" {% if not entry or entry.enabled %}checked{% endif %}>{{ tr('Enabled') }}</label>
<div data-intake-controls hidden><label>{{ tr('Work type') }}<select data-intake-type data-plain>{% for kind in ['task','story','bug','epic'] %}<option>{{ kind }}</option>{% endfor %}</select></label><label>{{ tr('Priority') }}<select data-intake-priority data-plain>{% for kind in ['highest','high','medium','low','lowest'] %}<option {% if kind=='medium' %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select></label><div data-intake-fields></div><button type="button" data-intake-add>{{ tr('Add field') }}</button></div>
<details><summary>{{ tr('Form configuration JSON') }}</summary><p>{{ tr('Fields support text, paragraph, integer, number, date, choice, multi_choice and boolean. Keys must be unique.') }}</p><label>{{ tr('Configuration') }}<textarea name="config" rows="8" required data-intake-json>{{ entry.config|tojson if entry else '{"item_type":"task","priority":"medium","fields":[]}' }}</textarea></label></details><button class="primary">{{ tr('Save form') }}</button></form>
