{% extends 'projects/timeline.html' %}
{% block planning_header %}{% include 'projects/_plan_header.html' %}
<div class="planning-toolbar"><form method="get"><label>{{ tr('Saved view') }}<select name="saved_view">{% for v in plan_document.settings.views %}<option value="{{ loop.index0 }}">{{ v.name }}</option>{% else %}<option value="">{{ tr('Basic') }}</option>{% endfor %}</select></label><button>{{ tr('Open view') }}</button></form>{% if plan_editable %}<details><summary class="button">{{ tr('Save as new view') }}</summary><form method="post" action="{{ url_for('projects.advanced_plan_edit',plan_id=plan.id,action='save-view') }}" class="panel stack"><input type="hidden" name="revision" value="{{ plan.revision }}">{% for field,value in [('q',q),('category',category),('assignee',assignee),('zoom',zoom)] %}<input type="hidden" name="{{ field }}" value="{{ value }}">{% endfor %}<label>{{ tr('View name') }}<input name="name" maxlength="60" required></label><button>{{ tr('Save view') }}</button></form></details>{% endif %}</div>
{% endblock %}
