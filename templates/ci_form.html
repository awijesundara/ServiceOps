{% extends "base.html" %}{% block title %}{{ 'Edit ' + ci.name if ci else 'New configuration item' }} · {{ instance_name }}{% endblock %}
{% block content %}<header class="page-head"><div><p class="eyebrow">CMDB</p><h1>{{ 'Edit ' + ci.name if ci else 'New configuration item' }}</h1></div></header><form method="post" class="panel form-grid"><label>Name<input name="name" value="{{ ci.name if ci else '' }}" required></label><label>Class<input name="ci_class" value="{{ ci.ci_class if ci else '' }}" placeholder="Server, Database, Business Application…" required></label><label>Environment<select name="environment">{% for value in ['Production','Staging','Development','Test'] %}<option {% if ci and ci.environment==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label>Status<select name="operational_status">{% for value in ['Operational','Degraded','Down','Maintenance','Retired'] %}<option {% if ci and ci.operational_status==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label class="wide">IP address<input name="ip_address" value="{{ ci.ip_address if ci else '' }}"></label>{% if ci %}<label class="wide">Owner<select name="owner_id"><option value="">Unassigned</option>{% for user in owners %}<option value="{{ user.id }}" {% if ci.owner_id==user.id %}selected{% endif %}>{{ user.name }} ({{ user.username }})</option>{% endfor %}</select></label>{% endif %}<div class="wide actions"><a class="button" href="{{ url_for('cmdb') }}">Cancel</a><button class="primary">{{ 'Save changes' if ci else 'Create CI' }}</button></div></form>{% endblock %}
