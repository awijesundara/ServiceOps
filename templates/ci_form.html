{% extends "base.html" %}{% block content %}<header class="page-head"><div><p class="eyebrow">CMDB</p><h1>New configuration item</h1></div></header><form method="post" class="panel form-grid"><label>Name<input name="name" required></label><label>Class<input name="ci_class" placeholder="Server, Database, Business Application…" required></label><label>Environment<select name="environment"><option>Production</option><option>Staging</option><option>Development</option><option>Test</option></select></label><label>Status<select name="operational_status"><option>Operational</option><option>Degraded</option><option>Down</option><option>Maintenance</option><option>Retired</option></select></label><label class="wide">IP address<input name="ip_address"></label><div class="wide actions"><a class="button" href="{{ url_for('cmdb') }}">Cancel</a><button class="primary">Create CI</button></div></form>{% endblock %}
