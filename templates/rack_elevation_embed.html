{% set ui_theme = ui_preference.theme if current_user.is_authenticated and ui_preference.theme in ('dark', 'system') else 'light' %}
<!doctype html>
<html lang="{{ ui_language }}" dir="{{ ui_direction }}"{% if ui_theme != 'light' %} class="theme-dark"{% endif %}>
<head>
<meta charset="utf-8">
<title>{{ rack.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=app_version) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='utilities.css', v=app_version) }}">
{% if ui_theme != 'light' %}<link rel="stylesheet" href="{{ url_for('static', filename='dark.css', v=app_version) }}"{% if ui_theme == 'system' %} media="(prefers-color-scheme: dark)"{% endif %}>{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='rack-embed.css', v=app_version) }}">
<script type="application/json" id="serviceops-i18n">{{ ui_javascript_catalog|tojson }}</script>
<script src="{{ url_for('static', filename='i18n.js', v=app_version) }}"></script>
</head>
<body>
<div id="rack-elevation-root" data-rack="{{ rack_json }}">
  <div class="rack-embed-panels">
    <div><h3>{{ tr('Front') }}</h3><svg id="rack-elevation-front" data-face="front"></svg></div>
    <div><h3>{{ tr('Rear') }}</h3><svg id="rack-elevation-rear" data-face="rear"></svg></div>
  </div>
  <div id="rack-pdu-list"></div><div id="rack-unplaced-list"></div>
  <p id="rack-elevation-empty" class="muted u-text-12" hidden>{{ tr('Nothing mounted in this rack yet.') }}</p>
</div>
<script src="{{ url_for('static', filename='rack-elevation.js', v=app_version) }}" defer></script>
</body>
</html>
