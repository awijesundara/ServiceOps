<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ rack.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=app_version) }}">
<style>body{margin:0;padding:8px;background:#fff}.rack-embed-panels{display:flex;gap:10px}.rack-embed-panels>div{flex:1;min-width:0}.rack-embed-panels h3{font-size:11px;margin:0 0 4px;color:var(--muted)}</style>
</head>
<body>
<div id="rack-elevation-root" data-rack="{{ rack_json }}">
  <div class="rack-embed-panels">
    <div><h3>Front</h3><svg id="rack-elevation-front" width="140" data-face="front"></svg></div>
    <div><h3>Rear</h3><svg id="rack-elevation-rear" width="140" data-face="rear"></svg></div>
  </div>
  <p id="rack-elevation-empty" class="muted" hidden style="font-size:12px">Nothing mounted in this rack yet.</p>
</div>
<script src="{{ url_for('static', filename='rack-elevation.js', v=app_version) }}" defer></script>
</body>
</html>
