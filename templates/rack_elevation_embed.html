<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ rack.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=app_version) }}">
<style>
html,body{margin:0;background:#fff}
body{padding:14px;box-sizing:border-box;font-family:inherit}
.rack-embed-panels{display:flex;gap:14px}
.rack-embed-panels>div{flex:1;min-width:0;border:1px solid var(--line,#dfe5e8);border-radius:8px;padding:10px}
.rack-embed-panels h3{font-size:11px;margin:0 0 8px;color:var(--muted,#667582);font-weight:650;text-transform:uppercase;letter-spacing:.02em}
.rack-embed-panels svg{display:block;width:100%;height:auto;background:#fff}
.rack-embed-panels a{cursor:pointer}
</style>
</head>
<body>
<div id="rack-elevation-root" data-rack="{{ rack_json }}">
  <div class="rack-embed-panels">
    <div><h3>Front</h3><svg id="rack-elevation-front" data-face="front"></svg></div>
    <div><h3>Rear</h3><svg id="rack-elevation-rear" data-face="rear"></svg></div>
  </div>
  <p id="rack-elevation-empty" class="muted" hidden style="font-size:12px">Nothing mounted in this rack yet.</p>
</div>
<script src="{{ url_for('static', filename='rack-elevation.js', v=app_version) }}" defer></script>
</body>
</html>
