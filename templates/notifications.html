{% extends "base.html" %}{% block content %}<header class="page-head"><div><p class="eyebrow">INBOX</p><h1>Notifications</h1></div></header><section class="panel notification-list">{% for n in rows %}<article><div class="avatar">N</div><div><strong>{{ n.title }}</strong><p>{{ n.body }}</p><small>{{ n.created_at.strftime('%b %d, %H:%M') }}</small></div></article>{% else %}<div class="empty">You have no notifications.</div>{% endfor %}</section>{% endblock %}
