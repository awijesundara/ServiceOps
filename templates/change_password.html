{% extends "base.html" %}
{% block title %}Change password · {{ instance_name }}{% endblock %}
{% block content %}
<header class="page-head"><div><p class="eyebrow">CREDENTIAL SECURITY</p><h1>Change local password</h1><p>Changing the credential invalidates every other browser session for this account.</p></div></header>
<form method="post" class="panel form-grid">
  <label class="wide">Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
  <label>New password<input type="password" name="new_password" minlength="14" autocomplete="new-password" required></label>
  <label>Confirm new password<input type="password" name="confirm_password" minlength="14" autocomplete="new-password" required></label>
  <div class="wide actions"><a class="button" href="{{ url_for('preferences') }}">Cancel</a><button class="primary">Change password</button></div>
</form>
{% endblock %}
