{% extends "base.html" %}{% block content %}<header class="page-head"><div><p class="eyebrow">ADMINISTRATION</p><h1>Users & roles</h1></div><a class="primary button" href="{{ url_for('user_new') }}">+ New user</a></header><section class="panel"><table><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>{% for u in users %}<tr><td><strong>{{ u.name }}</strong></td><td>{{ u.username }}</td><td>{{ u.email }}</td><td><span class="tag">{{ u.role }}</span></td><td>{{ 'Active' if u.active else 'Disabled' }}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
