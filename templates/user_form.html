{% extends "base.html" %}{% block title %}New user · {{ instance_name }}{% endblock %}
{% block content %}<header class="page-head"><div><p class="eyebrow">ADMINISTRATION</p><h1>New user</h1></div></header><form method="post" class="panel form-grid"><label>Name<input name="name" required></label><label>Username<input name="username" required></label><label>Email<input type="email" name="email" required></label><label>Role<select name="role"><option>requester</option><option>agent</option><option>manager</option><option>admin</option></select></label><label class="wide">Temporary password<input type="password" name="password" minlength="8" required></label><div class="wide actions"><a class="button" href="{{ url_for('users') }}">Cancel</a><button class="primary">Create user</button></div></form>{% endblock %}
