{% extends "base.html" %}{% block title %}{{ tr('Edit {name} · {instance_name}', name=(rack.name), instance_name=(instance_name)) }}{% endblock %}
{% block content %}<header class="page-head"><div><p class="eyebrow">CMDB</p><h1>{{ tr('Edit {name}', name=(rack.name)) }}</h1></div><a class="button" href="{{ url_for('rack_list') }}">← {{ tr('Back to racks') }}</a></header>
<form method="post" class="panel form-grid">
<label>{{ tr('Name') }}<input name="name" value="{{ rack.name }}" required></label>
<label>{{ tr('Site') }}<input name="site" value="{{ rack.site }}"></label>
<label>{{ tr('Height (U)') }}<input type="number" name="u_height" value="{{ rack.u_height }}" min="1" max="60"></label>
<label class="wide">{{ tr('Notes') }}<textarea name="notes" rows="4">{{ rack.notes }}</textarea></label>
<div class="wide actions">
<a class="button" href="{{ url_for('rack_list') }}">{{ tr('Cancel') }}</a>
<button type="submit" class="button" form="rack-delete-form">{{ tr('Delete') }}</button>
<button class="primary">{{ tr('Save changes') }}</button>
</div>
</form>
<form method="post" id="rack-delete-form" action="{{ url_for('rack_delete', rack_id=rack.id) }}" data-confirm="{{ tr('Delete this rack? This cannot be undone.') }}" hidden></form>
{% endblock %}
