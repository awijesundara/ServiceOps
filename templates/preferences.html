{% extends "base.html" %}{% block content %}<header class="page-head"><div><p class="eyebrow">PERSONALIZATION</p><h1>Display & accessibility</h1><p>Choose how {{ instance_name }} looks and behaves for your account.</p></div></header><form method="post" class="panel form-grid"><input type="hidden" name="theme" value="light"><label>Density<select name="density"><option value="comfortable" {% if pref.density=='comfortable' %}selected{% endif %}>Comfortable</option><option value="compact" {% if pref.density=='compact' %}selected{% endif %}>Compact</option></select></label><label>Font size<input type="range" name="font_scale" min="80" max="140" value="{{ pref.font_scale }}"><small>{{ pref.font_scale }}%</small></label><label>Start page<select name="start_page"><option value="/">Dashboard</option><option value="/task-board" {% if pref.start_page=='/task-board' %}selected{% endif %}>Visual task board</option><option value="/modules" {% if pref.start_page=='/modules' %}selected{% endif %}>All workspaces</option></select></label><label class="check wide"><input type="checkbox" name="high_contrast" {% if pref.high_contrast %}checked{% endif %}> High contrast</label><label class="check wide"><input type="checkbox" name="reduced_motion" {% if pref.reduced_motion %}checked{% endif %}> Reduce motion</label><label class="check wide"><input type="checkbox" name="nav_pinned" {% if pref.nav_pinned %}checked{% endif %}> Keep navigation pinned</label><div class="wide actions"><button class="primary">Save preferences</button></div></form>{% endblock %}
