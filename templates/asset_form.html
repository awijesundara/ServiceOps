{% extends "base.html" %}{% block title %}{{ tr('New asset · {instance_name}', instance_name=(instance_name)) }}{% endblock %}
{% block content %}<header class="page-head"><div><p class="eyebrow">CMDB</p><h1>{{ tr('New asset') }}</h1></div></header><form method="post" class="panel form-grid"><label>{{ tr('Asset tag') }}<input name="asset_tag" required></label><label>{{ tr('Name') }}<input name="name" required></label><label>{{ tr('Type') }}<input name="asset_type" placeholder="{{ tr('Laptop, Server…') }}" required></label><label>{{ tr('Status') }}<select name="status"><option value="In stock">{{ tr('In stock') }}</option><option value="In use">{{ tr('In use') }}</option><option value="In repair">{{ tr('In repair') }}</option><option value="Retired">{{ tr('Retired') }}</option></select></label><label class="wide">{{ tr('Serial number') }}<input name="serial_number"></label><div class="wide actions"><a class="button" href="{{ url_for('assets') }}">{{ tr('Cancel') }}</a><button class="primary">{{ tr('Create asset') }}</button></div></form>{% endblock %}
