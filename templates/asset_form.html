{% extends "base.html" %}{% block title %}New asset · {{ instance_name }}{% endblock %}
{% block content %}<header class="page-head"><div><p class="eyebrow">CMDB</p><h1>New asset</h1></div></header><form method="post" class="panel form-grid"><label>Asset tag<input name="asset_tag" required></label><label>{{ t('Name') }}<input name="name" required></label><label>Type<input name="asset_type" placeholder="Laptop, Server…" required></label><label>{{ t('Status') }}<select name="status"><option>In stock</option><option>In use</option><option>In repair</option><option>Retired</option></select></label><label class="wide">Serial number<input name="serial_number"></label><div class="wide actions"><a class="button" href="{{ url_for('assets') }}">{{ t('Cancel') }}</a><button class="primary">Create asset</button></div></form>{% endblock %}
