{% extends "base.html" %}
{% block title %}Verify sign-in · ServiceOps{% endblock %}
{% block content %}
<section class="login-card">
  <h1>Two-factor verification</h1>
  <p>Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
  <form method="post" class="stack">
    <label>Verification code<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
    <button class="primary">Verify</button>
  </form>
  <div class="wide actions"><a class="button" href="{{ url_for('login') }}">Cancel sign-in</a></div>
</section>
{% endblock %}
