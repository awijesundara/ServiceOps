{% extends "base.html" %}
{% block title %}Reset password · {{ instance_name }}{% endblock %}
{% block content %}
<section class="login-card">
  {% if has_company_logo %}
  <img class="company-logo brand-login-mark" src="{{ url_for('company_logo') }}" alt="{{ company_name }} logo">
  {% else %}
  <img class="serviceops-wordmark brand-login-wordmark" src="{{ url_for('static', filename='brand/serviceops-wordmark.png', v=app_version) }}" alt="ServiceOps">
  {% endif %}
  <h1>Choose a new password</h1>
  <p>This link is single-use and expires after 30 minutes.</p>
  <form method="post" class="stack">
    <label>New password<input type="password" name="password" required autocomplete="new-password"></label>
    <label>Confirm password<input type="password" name="confirmation" required autocomplete="new-password"></label>
    <button class="primary">Reset password</button>
  </form>
  <a class="login-card-back" href="{{ url_for('login') }}"><span aria-hidden="true">‹</span> Back to sign in</a>
</section>
{% endblock %}
