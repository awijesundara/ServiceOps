repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check
        language: system
        types: [python]
      - id: release-version
        name: Canonical release version
        entry: python3 tools/release_version.py --check
        language: system
        pass_filenames: false
      - id: shell-syntax
        name: Shell syntax
        entry: bash -c 'for file in "$@"; do bash -n "$file"; done' --
        language: system
        types: [shell]
