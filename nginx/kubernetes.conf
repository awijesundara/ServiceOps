# A separate container serves public application assets and proxies dynamic
# requests. Cloudflare Access continues to protect the same Service/Ingress.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 25m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    map $arg_v $asset_cache {
        "" "public, max-age=0, must-revalidate";
        default "public, max-age=31536000, immutable";
    }
    server {
        listen 8081;
        server_tokens off;
        location = /edge-live { access_log off; return 200 "ok\n"; }
        location /static/ {
            alias /app/static/;
            autoindex off;
            disable_symlinks on;
            add_header Cache-Control $asset_cache;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Preserve the trusted ingress's existing forwarding chain: the
            # application already validates proxy addresses and public origin.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
