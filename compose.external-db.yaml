name: serviceops

services:
  app:
    image: ${SERVICEOPS_IMAGE:-serviceops-app:latest}
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TEAM_MANAGER_PASSWORD: ${TEAM_MANAGER_PASSWORD:?Set TEAM_MANAGER_PASSWORD in .env}
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - serviceops_uploads:/app/uploads
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  serviceops_uploads:
    name: serviceops_uploads
