name: serviceops

services:
  app:
    image: ${SERVICEOPS_IMAGE:?Set an immutable SERVICEOPS_IMAGE tag in .env}
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DEPLOYMENT_PROFILE: production
      INSTANCE_NAME: ${INSTANCE_NAME:-ServiceOps}
      COMPANY_NAME: ${COMPANY_NAME:-Your Company}
      BRAND_TEAL: ${BRAND_TEAL:-#003e4c}
      BRAND_AMBER: ${BRAND_AMBER:-#f9aa3c}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:-}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVER_URI: ${LDAP_SERVER_URI:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(&(objectClass=user)(sAMAccountName={username}))}
      LDAP_START_TLS: ${LDAP_START_TLS:-true}
      LDAP_VALIDATE_CERT: ${LDAP_VALIDATE_CERT:-true}
      LDAP_CA_CERT: ${LDAP_CA_CERT:-}
      LDAP_ROLE_MAPPINGS: ${LDAP_ROLE_MAPPINGS:-{}}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      KEYCLOAK_DISCOVERY_URL: ${KEYCLOAK_DISCOVERY_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ROLE_MAPPINGS: ${KEYCLOAK_ROLE_MAPPINGS:-{}}
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - serviceops_uploads:/app/uploads
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  worker:
    image: ${SERVICEOPS_IMAGE:?Set an immutable SERVICEOPS_IMAGE tag in .env}
    build: .
    command: ["python", "-m", "tools.outbox_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:-}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-}
      DEPLOYMENT_PROFILE: production
      AUTO_MIGRATE: "false"
      UPLOAD_FOLDER: /tmp/uploads
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  serviceops_uploads:
    name: serviceops_uploads
