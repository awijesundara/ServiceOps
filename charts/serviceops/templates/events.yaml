{{- if .Values.events.enabled }}
# Live events (tools/events_server.py): Server-Sent Events to browsers, fed
# by PostgreSQL LISTEN/NOTIFY. Browsers fall back to timed checks when it is
# unavailable, so it is safe to scale to zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serviceops.fullname" . }}-events
  labels: {{- include "serviceops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.events.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: events
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: events
    spec:
      serviceAccountName: {{ include "serviceops.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: events
          image: {{ include "serviceops.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "tools.events_server"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: EVENTS_PORT, value: "8090"}
            - {name: EVENTS_AUTH_URL, value: {{ printf "http://%s:%v/events/auth" (include "serviceops.fullname" .) .Values.service.port | quote }}}
            - {name: EVENTS_MAX_CONNECTIONS, value: {{ .Values.events.maxConnections | quote }}}
            - {name: EVENTS_MAX_PER_USER, value: {{ .Values.events.maxPerUser | quote }}}
          envFrom:
            - secretRef: {name: {{ include "serviceops.secretName" . }}}
          ports:
            - {name: http, containerPort: 8090, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.events.resources | nindent 12 }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "serviceops.fullname" . }}-events
  labels: {{- include "serviceops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: events
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "serviceops.fullname" . }}-events
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: events
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.ingress.enabled }}
    - from:
        - namespaceSelector: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - {port: 8090, protocol: TCP}
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {port: 8090, protocol: TCP}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 5432, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {{- include "serviceops.webSelectorLabels" . | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
        - {port: 8081, protocol: TCP}
{{- end }}
{{- end }}
