{{- if and (eq .Values.deploymentProfile "production") (lt (int .Values.replicaCount) 2) (not .Values.autoscaling.enabled) (not .Values.allowSingleReplica) }}
{{- fail "Production requires at least two application replicas (set allowSingleReplica: true to accept a single replica deliberately)" }}
{{- end }}
{{- if and (eq .Values.deploymentProfile "production") (not .Values.uploads.persistence.enabled) }}
{{- fail "Production requires persistent shared upload storage; configure uploads.persistence or object storage" }}
{{- end }}
{{- if and (eq .Values.deploymentProfile "production") .Values.ingress.enabled .Values.networkPolicy.enabled (empty .Values.networkPolicy.ingressNamespaceSelector) }}
{{- fail "Production ingress requires networkPolicy.ingressNamespaceSelector to identify trusted ingress-controller namespaces" }}
{{- end }}
{{- if and (eq .Values.deploymentProfile "production") .Values.observability.serviceMonitor.enabled .Values.networkPolicy.enabled (empty .Values.observability.serviceMonitor.prometheusNamespaceSelector) }}
{{- fail "Production ServiceMonitor requires observability.serviceMonitor.prometheusNamespaceSelector to identify trusted Prometheus namespaces" }}
{{- end }}
{{- if and .Release.IsUpgrade (eq .Values.deploymentProfile "production") (empty .Values.database.backupReference) }}
{{- fail "Production upgrades require database.backupReference for a completed, restore-tested pre-upgrade backup" }}
{{- end }}
apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" .Values.progressiveDelivery.enabled }}
kind: {{ ternary "Rollout" "Deployment" .Values.progressiveDelivery.enabled }}
metadata:
  name: {{ include "serviceops.fullname" . }}
  labels: {{- include "serviceops.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  {{- if .Values.progressiveDelivery.enabled }}
  strategy:
    canary:
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      steps:
        {{- toYaml .Values.progressiveDelivery.steps | nindent 8 }}
      {{- if .Values.progressiveDelivery.prometheus.enabled }}
      analysis:
        templates:
          - templateName: {{ include "serviceops.fullname" . }}-canary
      {{- end }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  {{- end }}
  selector:
    # Keep this selector stable across chart upgrades; Kubernetes treats a
    # Deployment selector as immutable. Component scoping belongs on the pod
    # template and consumers (Service/PDB/NetworkPolicy), below.
    matchLabels: {{- include "serviceops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serviceops.webSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        serviceops.io/pre-upgrade-backup-reference: {{ default "initial-install" .Values.database.backupReference | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.observability.openTelemetry.enabled }}
        instrumentation.opentelemetry.io/inject-python: {{ required "observability.openTelemetry.instrumentation is required when OpenTelemetry injection is enabled" .Values.observability.openTelemetry.instrumentation | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "serviceops.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: database-and-schema-ready
          image: {{ include "serviceops.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "tools.wait_for_database", "--migrations-current", "--timeout", {{ .Values.database.readinessTimeoutSeconds | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef: {name: {{ include "serviceops.fullname" . }}-config}
            - secretRef: {name: {{ include "serviceops.secretName" . }}}
      containers:
        - name: serviceops
          image: {{ include "serviceops.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
            - {name: probe-http, containerPort: 8082, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: GUNICORN_HEALTH_PORT, value: "8082"}
            - {name: GUNICORN_WORKERS, value: {{ .Values.web.workers | quote }}}
            - {name: GUNICORN_THREADS, value: {{ .Values.web.threads | quote }}}
            - {name: DEPLOYMENT_PROFILE, value: {{ .Values.deploymentProfile | quote }}}
            - {name: DEPLOYMENT_MODE, value: "kubernetes"}
            - {name: UPLOAD_FOLDER, value: /app/uploads}
            - {name: LOG_DIR, value: /tmp/logs}
            - {name: LOCAL_AUTH_ENABLED, value: {{ .Values.auth.localEnabled | quote }}}
            - {name: CSRF_ENABLED, value: {{ .Values.security.csrfEnabled | quote }}}
            - {name: SESSION_COOKIE_SECURE, value: {{ .Values.security.sessionCookieSecure | quote }}}
            - {name: SESSION_LIFETIME_MINUTES, value: {{ .Values.security.sessionLifetimeMinutes | quote }}}
            - {name: AUTO_MIGRATE, value: "false"}
            - {name: LDAP_ENABLED, value: {{ .Values.auth.ldap.enabled | quote }}}
            - {name: LDAP_SERVER_URI, value: {{ .Values.auth.ldap.serverUri | quote }}}
            - {name: LDAP_BIND_DN, value: {{ .Values.auth.ldap.bindDn | quote }}}
            - {name: LDAP_BASE_DN, value: {{ .Values.auth.ldap.baseDn | quote }}}
            - {name: LDAP_USER_FILTER, value: {{ .Values.auth.ldap.userFilter | quote }}}
            - {name: LDAP_START_TLS, value: {{ .Values.auth.ldap.startTls | quote }}}
            - {name: LDAP_VALIDATE_CERT, value: {{ .Values.auth.ldap.validateCertificate | quote }}}
            - {name: LDAP_ROLE_MAPPINGS, value: {{ .Values.auth.ldap.roleMappings | quote }}}
            - {name: KEYCLOAK_ENABLED, value: {{ .Values.auth.keycloak.enabled | quote }}}
            - {name: KEYCLOAK_DISCOVERY_URL, value: {{ .Values.auth.keycloak.discoveryUrl | quote }}}
            - {name: KEYCLOAK_CLIENT_ID, value: {{ .Values.auth.keycloak.clientId | quote }}}
            - {name: KEYCLOAK_ROLE_MAPPINGS, value: {{ .Values.auth.keycloak.roleMappings | quote }}}
            - {name: WEBAUTHN_RP_ID, value: {{ .Values.auth.passkeys.rpId | quote }}}
            - {name: WEBAUTHN_RP_NAME, value: {{ .Values.auth.passkeys.rpName | quote }}}
            - {name: WEBAUTHN_ORIGIN, value: {{ .Values.auth.passkeys.origin | quote }}}
            - {name: CLOUDFLARE_ACCESS_TEAM_DOMAIN, value: {{ .Values.auth.cloudflareAccess.teamDomain | quote }}}
            - {name: CLOUDFLARE_ACCESS_AUD, value: {{ .Values.auth.cloudflareAccess.aud | quote }}}
            - {name: APPLE_PASSKEY_APP_ID, value: {{ .Values.auth.passkeys.appleAppId | quote }}}
            - {name: TRUST_PROXY_HEADERS, value: {{ .Values.proxy.trustHeaders | quote }}}
            - {name: PUBLIC_BASE_URL, value: {{ include "serviceops.publicBaseUrl" . | quote }}}
            - {name: TRUST_CLOUDFLARE_PROXY, value: {{ .Values.proxy.trustCloudflare | quote }}}
            - {name: TRUSTED_PROXY_CIDRS, value: {{ .Values.proxy.trustedCidrs | default "" | quote }}}
            - {name: CLIENT_IP_HEADER, value: {{ .Values.proxy.clientIpHeader | default "" | quote }}}
            - {name: ENABLE_HSTS, value: {{ .Values.proxy.enableHsts | quote }}}
          envFrom:
            - configMapRef: {name: {{ include "serviceops.fullname" . }}-config}
            - secretRef: {name: {{ include "serviceops.secretName" . }}}
            - secretRef: {name: {{ include "serviceops.bootstrapSecretName" . }}}
          volumeMounts:
            - {name: uploads, mountPath: /app/uploads}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.auth.ldap.caCertificate }}
            - {name: ldap-ca, mountPath: /etc/serviceops/ldap, readOnly: true}
            {{- end }}
          startupProbe:
            httpGet: {path: /live, port: probe-http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: probe-http}
            periodSeconds: 10
            timeoutSeconds: {{ .Values.web.probes.readinessTimeoutSeconds }}
            failureThreshold: {{ .Values.web.probes.readinessFailureThreshold }}
          livenessProbe:
            httpGet: {path: /live, port: probe-http}
            periodSeconds: 20
            timeoutSeconds: {{ .Values.web.probes.livenessTimeoutSeconds }}
            failureThreshold: {{ .Values.web.probes.livenessFailureThreshold }}
          lifecycle:
            preStop: {exec: {command: ["/bin/sh", "-c", "sleep {{ .Values.rollingUpdate.preStopDelaySeconds }}"]}}
          resources: {{- toYaml (default .Values.resources .Values.web.resources) | nindent 12 }}
        {{- if .Values.web.staticOffload.enabled }}
        - name: static-edge
          image: {{ include "serviceops.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nginx", "-c", "/app/nginx/kubernetes.conf", "-g", "daemon off;"]
          ports:
            - {name: edge-http, containerPort: 8081, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources: {{- toYaml .Values.web.staticOffload.resources | nindent 12 }}
          volumeMounts:
            - {name: edge-tmp, mountPath: /tmp}
            {{- if .Values.events.enabled }}
            - {name: edge-routes, mountPath: /etc/serviceops-edge, readOnly: true}
            {{- end }}
          startupProbe:
            httpGet: {path: /edge-live, port: edge-http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /edge-live, port: edge-http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /edge-live, port: edge-http}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
        {{- end }}
      volumes:
        {{- if .Values.web.staticOffload.enabled }}
        - name: edge-tmp
          emptyDir: {}
        {{- if .Values.events.enabled }}
        - name: edge-routes
          configMap: {name: {{ include "serviceops.fullname" . }}-edge-routes}
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: uploads
          {{- if .Values.uploads.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-uploads" (include "serviceops.fullname" .)) .Values.uploads.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.auth.ldap.caCertificate }}
        - name: ldap-ca
          configMap: {name: {{ include "serviceops.fullname" . }}-ldap-ca}
        {{- end }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      topologySpreadConstraints: {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
