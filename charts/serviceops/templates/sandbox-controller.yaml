{{- if .Values.premium.sandbox.enabled }}
{{- $namespace := .Values.premium.sandbox.namespace }}
{{- $storageNode := required "Set premium.sandbox.storageNode when enabling sandbox local storage" .Values.premium.sandbox.storageNode }}
{{- $image := default (include "serviceops.imageRef" .) .Values.premium.sandbox.image }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $image) }}{{ fail "Sandbox preview image must be immutable and referenced by digest" }}{{ end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: serviceops-sandbox-budget, namespace: {{ $namespace }}}
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    requests.storage: 6Gi
    persistentvolumeclaims: "4"
    pods: "12"
---
{{- range $slot := list 1 2 }}
{{- range $kind := list "db" "uploads" }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: serviceops-sandbox-{{ $kind }}-slot{{ $slot }}
  annotations: {helm.sh/resource-policy: keep}
  labels: {serviceops.io/sandbox-pool: "true"}
spec:
  capacity: {storage: {{ if eq $kind "db" }}2Gi{{ else }}1Gi{{ end }}}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ $.Values.premium.sandbox.storageClass | quote }}
  hostPath:
    path: {{ printf "%s/slot%d/%s" $.Values.premium.sandbox.storageRoot $slot $kind | quote }}
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ $storageNode | quote }}]
---
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "serviceops.fullname" . }}-sandbox-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: serviceops-sandbox-controller, namespace: {{ $namespace }}}
rules:
  - apiGroups: [""]
    resources: [secrets,services,persistentvolumeclaims]
    verbs: [get,create,delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get,create,delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get,create,delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get,create,delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: serviceops-sandbox-controller, namespace: {{ $namespace }}}
subjects:
  - kind: ServiceAccount
    name: {{ include "serviceops.fullname" . }}-sandbox-controller
    namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: serviceops-sandbox-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ include "serviceops.fullname" . }}-sandbox-storage}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    resourceNames: [serviceops-sandbox-db-slot1,serviceops-sandbox-db-slot2,serviceops-sandbox-uploads-slot1,serviceops-sandbox-uploads-slot2]
    verbs: [get,patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ include "serviceops.fullname" . }}-sandbox-storage}
subjects:
  - kind: ServiceAccount
    name: {{ include "serviceops.fullname" . }}-sandbox-controller
    namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "serviceops.fullname" . }}-sandbox-storage}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serviceops.fullname" . }}-sandbox-controller
  labels: {{- include "serviceops.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "serviceops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-controller
  template:
    metadata:
      labels:
        {{- include "serviceops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox-controller
    spec:
      serviceAccountName: {{ include "serviceops.fullname" . }}-sandbox-controller
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: migrations-current
          image: {{ include "serviceops.imageRef" . | quote }}
          command: [python,-m,tools.wait_for_database,--migrations-current,--timeout,"300"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ include "serviceops.secretName" . }}, key: DATABASE_URL}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      containers:
        - name: controller
          image: {{ include "serviceops.imageRef" . | quote }}
          command: [python,-m,tools.sandbox_controller]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ include "serviceops.secretName" . }}, key: DATABASE_URL}
            - {name: SANDBOX_KUBERNETES_STRICT_X509, value: {{ .Values.premium.sandbox.strictAPIX509 | quote }}}
            - {name: SANDBOX_NAMESPACE, value: {{ $namespace | quote }}}
            - {name: SANDBOX_IMAGE, value: {{ $image | quote }}}
            - {name: SANDBOX_POSTGRES_IMAGE, value: {{ .Values.premium.sandbox.postgresImage | quote }}}
            - {name: SANDBOX_STORAGE_CLASS, value: {{ .Values.premium.sandbox.storageClass | quote }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe:
            exec: {command: [python,-c,"import os,time;assert time.time()-os.path.getmtime('/tmp/serviceops-sandbox-heartbeat')<90"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: {command: [python,-c,"import os,time;assert time.time()-os.path.getmtime('/tmp/serviceops-sandbox-heartbeat')<180"]}
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "serviceops.fullname" . }}-sandbox-controller-api}
spec:
  podSelector:
    matchLabels:
      {{- include "serviceops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-controller
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- if .Values.premium.sandbox.databaseEgress }}
    {{- toYaml .Values.premium.sandbox.databaseEgress | nindent 4 }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: {{ include "serviceops.name" . }}-postgresql}
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
    - to:
        {{- range .Values.premium.sandbox.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 16443}]
{{- end }}
