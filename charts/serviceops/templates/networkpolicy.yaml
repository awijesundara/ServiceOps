{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "serviceops.fullname" . }}
  labels: {{- include "serviceops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "serviceops.webSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "serviceops.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
        {{- if .Values.ingress.enabled }}
        - namespaceSelector: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        {{- end }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 5432, protocol: TCP}
        - {port: 389, protocol: TCP}
        - {port: 636, protocol: TCP}
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "serviceops.fullname" . }}-health-test
  labels: {{- include "serviceops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "serviceops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: helm-test
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {{- include "serviceops.webSelectorLabels" . | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
{{- end }}
