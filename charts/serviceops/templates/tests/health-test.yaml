apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "serviceops.fullname" . }}-health-test"
  labels: {{- include "serviceops.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    # Retain the completed pod so `helm test --logs` can collect evidence.
    # The next test run removes it before creating its replacement.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: curlimages/curl:8.15.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      command: ["curl", "--fail", "--silent", "--show-error", "--connect-timeout", "5", "--max-time", "15", "http://{{ include "serviceops.fullname" . }}:{{ .Values.service.port }}/ready"]
