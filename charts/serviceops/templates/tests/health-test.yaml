apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "serviceops.fullname" . }}-health-test"
  labels: {{- include "serviceops.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: curlimages/curl:8.15.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      command: ["curl", "--fail", "--silent", "--show-error", "http://{{ include "serviceops.fullname" . }}:{{ .Values.service.port }}/ready"]
