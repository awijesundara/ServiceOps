apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serviceops.fullname" . }}-worker
  labels: {{- include "serviceops.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "serviceops.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: database-and-schema-ready
          image: {{ include "serviceops.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "tools.wait_for_database", "--migrations-current", "--timeout", {{ .Values.database.readinessTimeoutSeconds | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          envFrom:
            - secretRef: {name: {{ include "serviceops.secretName" . }}}
      containers:
        - name: outbox
          image: {{ include "serviceops.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "tools.outbox_worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: DEPLOYMENT_PROFILE, value: "production"}
            - {name: DEPLOYMENT_MODE, value: "kubernetes"}
            - {name: AUTO_MIGRATE, value: "false"}
            - {name: UPLOAD_FOLDER, value: /tmp/uploads}
          envFrom:
            - secretRef: {name: {{ include "serviceops.secretName" . }}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "serviceops.fullname" . }}-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 5432, protocol: TCP}
        - {port: 25, protocol: TCP}
        - {port: 465, protocol: TCP}
        - {port: 587, protocol: TCP}
        - {port: 443, protocol: TCP}
{{- end }}
