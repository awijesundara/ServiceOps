name: Governed release

on:
  workflow_run:
    workflows: ["ServiceOps supply-chain gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      increment:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: governed-release-main
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout main with release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse a release from stale source
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [[ -n "$VALIDATED_SHA" ]]; then
            test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          fi

      - name: Calculate and synchronize the version
        id: version
        env:
          INCREMENT: ${{ inputs.increment || 'patch' }}
        run: |
          version="$(python3 tools/release_version.py --bump "$INCREMENT" --write --check)"
          tag="v${version}"
          git rev-parse "$tag" >/dev/null 2>&1 && { echo "Tag $tag already exists" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit the immutable release version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION README.md charts/serviceops/Chart.yaml charts/serviceops/values.yaml static/service-worker.js .env.example installer/app.py tools/install/server.sh packaging/rpm/serviceops.spec
          git commit -m "chore(release): ${TAG#v}"
          git tag -a "$TAG" -m "ServiceOps $TAG"
          git push origin HEAD:main "$TAG"

  supply-chain:
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/supply-chain.yml
    with:
      checkout_ref: ${{ needs.version.outputs.tag }}
      publish_release: true
    secrets: inherit

  rpm:
    needs: [version, supply-chain]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/rpm.yml
    with:
      checkout_ref: ${{ needs.version.outputs.tag }}
      image_digest: ${{ needs.supply-chain.outputs.image_digest }}

  publish:
    needs: [version, supply-chain, rpm]
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified RPM matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: serviceops-rpm-*
          path: release-assets
          merge-multiple: true

      - name: Publish verified GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir publish-assets
          find release-assets -type f \( -name '*.rpm' -o -name '*.sha256' \) \
            -exec cp '{}' publish-assets/ \;
          test "$(find publish-assets -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 5
          test "$(find publish-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 5
          (
            cd publish-assets
            for checksum in ./*.rpm.sha256; do
              rpm="${checksum%.sha256}"
              expected="$(cut -d ' ' -f1 "$checksum")"
              actual="$(sha256sum "$rpm" | cut -d ' ' -f1)"
              test "$actual" = "$expected"
              printf '%s  %s\n' "$actual" "${rpm#./}" > "$checksum"
            done
            sha256sum --check -- ./*.sha256
          )
          gh release create "$TAG" publish-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "ServiceOps $TAG"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 10
