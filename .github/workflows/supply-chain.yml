name: ServiceOps supply-chain gate

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Immutable tag or SHA to build
        required: true
        type: string
      publish_release:
        description: Publish, sign, and attest the image
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable tag or SHA to build
        required: false
        type: string
      publish_release:
        description: Publish, sign, and attest the image
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    # Deliberately branches only, not tags: this repo's release convention
    # (CLAUDE.md) pushes a commit to main and its vX.Y.Z tag together, and
    # a tag always points at a commit already on main. Triggering on both
    # built two separate, fully redundant workflow runs for the identical
    # commit/image tag, racing to push the same immutable image reference
    # to GHCR -- found via a real, reproducible failure (not theorized):
    # the branch-triggered run's push always won the race, and the
    # tag-triggered run's identical push consistently failed with
    # "denied: permission_denied: read_package" on the second attempt at
    # the same tag. The branch-triggered run alone already fully verifies
    # and publishes every release commit.
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Compute lowercase GHCR image reference
        run: |
          repo_lower="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          release_sha="$(git rev-parse HEAD)"
          echo "IMAGE_NAME=${repo_lower}-server" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${release_sha}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=ghcr.io/${repo_lower}-server:${release_sha}" >> "$GITHUB_ENV"

      - name: Run complete application suite
        run: |
          docker build --file Dockerfile.test --tag serviceops-test:${RELEASE_SHA} .
          docker run --rm serviceops-test:${RELEASE_SHA} python tools/release_version.py --check
          docker run --rm serviceops-test:${RELEASE_SHA} ruff check .
          docker run --rm serviceops-test:${RELEASE_SHA} python -m compileall -q app.py installer serviceops_core tools
          docker run --rm serviceops-test:${RELEASE_SHA} alembic heads | tee /tmp/alembic-heads.txt
          test "$(wc -l < /tmp/alembic-heads.txt)" -eq 1
          docker run --rm serviceops-test:${RELEASE_SHA} pytest -q

      - name: Validate shell, JavaScript, and Compose configuration
        env:
          POSTGRES_PASSWORD: quality-gate-only
          SECRET_KEY: quality-gate-only-secret-key-at-least-32-characters
          SETTINGS_ENCRYPTION_KEY: Z2F0ZS1vbmx5LWtleS1ub3QtZm9yLXJ1bnRpbWU=
          SERVICEOPS_IMAGE: serviceops-quality-gate:current
          DATABASE_URL: postgresql+psycopg://quality:quality@database.invalid/serviceops
        run: |
          find tools packaging -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n serviceops
          find static -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.external-db.yaml config --quiet

      - name: Set up Python for dependency audit
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit Python dependencies for known CVEs (pip-audit)
        run: |
          python -m pip install --quiet pip-audit==2.7.3
          python -m pip_audit -r requirements.txt --strict

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR for releases
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_REF }}
          push: ${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !(inputs.publish_release || startsWith(github.ref, 'refs/tags/v')) }}
          # The docker exporter used by `load: true` can't import a manifest
          # list, which provenance/sbom attestations force even for a single
          # platform. Only request them on the push (release-tag) path, where
          # the image goes straight to the registry instead of the local
          # docker daemon.
          provenance: ${{ (inputs.publish_release || startsWith(github.ref, 'refs/tags/v')) && 'mode=max' || false }}
          sbom: ${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/v') }}

      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: serviceops-image.cdx.json
          scanners: vuln

      - name: Install verified Cosign
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign release image by digest with GitHub OIDC
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest SLSA build provenance
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest CycloneDX SBOM
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: serviceops-image.cdx.json
          push-to-registry: true

      - name: Verify registry digest and GitHub provenance
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          gh attestation verify "oci://${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"

  browser-quality-gate:
    name: Browser and accessibility quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python for browser quality tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated test secrets
        shell: bash
        run: |
          admin_password="E2E-$(openssl rand -hex 18)"
          postgres_password="$(openssl rand -hex 24)"
          secret_key="$(openssl rand -hex 32)"
          settings_key="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())' 2>/dev/null || openssl rand -base64 32)"
          echo "::add-mask::${admin_password}"
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${secret_key}"
          echo "::add-mask::${settings_key}"
          {
            echo "E2E_ADMIN_PASSWORD=${admin_password}"
            echo "ADMIN_PASSWORD=${admin_password}"
            echo "POSTGRES_PASSWORD=${postgres_password}"
            echo "SECRET_KEY=${secret_key}"
            echo "SETTINGS_ENCRYPTION_KEY=${settings_key}"
            echo "SERVICEOPS_IMAGE=serviceops-e2e:${GITHUB_SHA}"
            echo "E2E_VOLUME_PREFIX=serviceops_e2e_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Start disposable Compose environment
        run: docker compose --project-name serviceops-e2e -f compose.yaml -f .github/compose.e2e.yaml up --build --detach --wait

      - name: Install browser quality tooling
        run: |
          python -m pip install --requirement requirements-dev.txt --requirement requirements-e2e.txt
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts axe-core@4.10.3
          echo "AXE_CORE_PATH=${GITHUB_WORKSPACE}/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: Run critical desktop and mobile journeys
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_ARTIFACT_DIR: test-results/browser
        run: |
          mkdir -p "${E2E_ARTIFACT_DIR}"
          python -m pytest tests/test_e2e_smoke.py -v

      - name: Capture Compose diagnostics on failure
        if: failure()
        run: |
          mkdir -p test-results
          docker compose --project-name serviceops-e2e -f compose.yaml -f .github/compose.e2e.yaml logs --no-color > test-results/compose.log

      - name: Upload browser traces, screenshots, and diagnostics
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: browser-quality-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down disposable environment
        if: always()
        run: docker compose --project-name serviceops-e2e -f compose.yaml -f .github/compose.e2e.yaml down --volumes --remove-orphans
