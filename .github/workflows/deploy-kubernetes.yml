name: Deploy verified release to Kubernetes

on:
  workflow_run:
    workflows: [Governed release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to deploy (latest when empty)
        required: false
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: serviceops-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.KUBERNETES_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Set up Docker Buildx for registry digest inspection
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve immutable stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          CONFIGURED_REPOSITORY: ${{ vars.KUBERNETES_IMAGE_REPOSITORY }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable tag: $tag" >&2; exit 1; }
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          release_sha="$(git rev-list -n 1 "$tag")"
          git checkout --detach "$release_sha"
          repository="$CONFIGURED_REPOSITORY"
          if [[ -z "$repository" ]]; then
            repository="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          fi
          digest="$(docker buildx imagetools inspect "$repository:$release_sha" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
          gh attestation verify "oci://$repository@$digest" --repo "$GITHUB_REPOSITORY"
          {
            echo "tag=$tag"
            echo "release_sha=$release_sha"
            echo "repository=$repository"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize protected deployment configuration
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBERNETES_VALUES_B64: ${{ secrets.KUBERNETES_VALUES_B64 }}
        run: |
          [[ -n "$KUBE_CONFIG_B64" ]] || { echo "KUBE_CONFIG_B64 production secret is required" >&2; exit 1; }
          [[ -n "$KUBERNETES_VALUES_B64" ]] || { echo "KUBERNETES_VALUES_B64 production secret is required" >&2; exit 1; }
          install -m 700 -d "$RUNNER_TEMP/serviceops-deploy"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/serviceops-deploy/kubeconfig"
          printf '%s' "$KUBERNETES_VALUES_B64" | base64 --decode > "$RUNNER_TEMP/serviceops-deploy/values.yaml"
          chmod 600 "$RUNNER_TEMP/serviceops-deploy/kubeconfig" "$RUNNER_TEMP/serviceops-deploy/values.yaml"

      - name: Lint and render the exact release chart
        env:
          IMAGE_REPOSITORY: ${{ steps.release.outputs.repository }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          helm lint charts/serviceops -f "$RUNNER_TEMP/serviceops-deploy/values.yaml" \
            --set-string "image.repository=$IMAGE_REPOSITORY" \
            --set-string "image.tag=$IMAGE_TAG" \
            --set-string "image.digest=$IMAGE_DIGEST"
          helm template serviceops charts/serviceops -f "$RUNNER_TEMP/serviceops-deploy/values.yaml" \
            --set-string "image.repository=$IMAGE_REPOSITORY" \
            --set-string "image.tag=$IMAGE_TAG" \
            --set-string "image.digest=$IMAGE_DIGEST" > "$RUNNER_TEMP/serviceops-deploy/rendered.yaml"

      - name: Atomically install or upgrade ServiceOps
        env:
          KUBECONFIG: ${{ runner.temp }}/serviceops-deploy/kubeconfig
          IMAGE_REPOSITORY: ${{ steps.release.outputs.repository }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE || 'serviceops' }}
          RELEASE: ${{ vars.KUBERNETES_RELEASE || 'serviceops' }}
        run: |
          kubectl cluster-info
          helm upgrade --install "$RELEASE" charts/serviceops \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$RUNNER_TEMP/serviceops-deploy/values.yaml" \
            --set-string "image.repository=$IMAGE_REPOSITORY" \
            --set-string "image.tag=$IMAGE_TAG" \
            --set-string "image.digest=$IMAGE_DIGEST" \
            --atomic --wait --timeout 10m
          kubectl rollout status "deployment/$RELEASE" -n "$NAMESPACE" --timeout=5m
          kubectl rollout status "deployment/$RELEASE-worker" -n "$NAMESPACE" --timeout=5m
          helm test "$RELEASE" -n "$NAMESPACE" --logs

      - name: Remove transient cluster credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/serviceops-deploy"
