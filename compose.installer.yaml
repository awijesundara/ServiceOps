name: serviceops-installer
services:
  installer:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-https://deb.debian.org/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://deb.debian.org/debian-security}
    command: ["gunicorn", "--bind", "0.0.0.0:8090", "--workers", "1", "--threads", "4", "installer.app:create_app()"]
    environment:
      INSTALLER_STATE_DIR: /config
      INSTALLER_SECRET: ${INSTALLER_SECRET}
      # Hostnames the browser may use to reach the installer, beyond
      # localhost/127.0.0.1/::1 (see installer/app.py). Defaults to the
      # published bind address so the URL web.sh prints keeps working.
      INSTALLER_ALLOWED_HOSTS: ${INSTALLER_ALLOWED_HOSTS:-${INSTALLER_BIND_ADDRESS:-127.0.0.1}}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./.installer-state:/config
    ports:
      - "${INSTALLER_BIND_ADDRESS:-127.0.0.1}:${INSTALLER_PORT:-8090}:8090"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
