name: serviceops

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serviceops}
      POSTGRES_USER: ${POSTGRES_USER:-serviceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - serviceops_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serviceops} -d ${POSTGRES_DB:-serviceops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb

  # Bundled IPFS node for the optional database-less deployment mode
  # (STORAGE_MODE=ipfs, IPFS_MODE=bundled -- the installer's default when
  # IPFS mode is chosen). Only starts when the "ipfs" Compose profile is
  # active (docker compose --profile ipfs up, or COMPOSE_PROFILES=ipfs in
  # .env); a default STORAGE_MODE=postgres deployment never starts this.
  # Under IPFS_MODE=external, this service is unused -- IPFS_API_URL
  # points at the operator's own node/gateway/pinning service instead.
  ipfs:
    image: ipfs/kubo:v0.33.0@sha256:a11e89f0f2a620acb3e8e1c49cdce81e80115194681924a5356f301cc6b66067
    profiles: ["ipfs"]
    environment:
      IPFS_PROFILE: server
    volumes:
      - serviceops_ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  app:
    image: ${SERVICEOPS_IMAGE:?Set an immutable SERVICEOPS_IMAGE tag in .env}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-serviceops}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-serviceops}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      DEPLOYMENT_PROFILE: production
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-bundled}
      # Optional database-less deployment mode (experimental, first slice
      # only covers file attachments -- see the storage-mode plan).
      # STORAGE_MODE=postgres (default) is unaffected by any of this. No
      # depends_on against the `ipfs` service below: it's profile-gated
      # (only exists when --profile ipfs is active) and `app` is not, so
      # Compose can't express a conditional dependency between them --
      # on a cold start in bundled IPFS mode, `app` may crash-loop briefly
      # until `ipfs` becomes healthy; restart:unless-stopped recovers it.
      STORAGE_MODE: ${STORAGE_MODE:-postgres}
      IPFS_API_URL: ${IPFS_API_URL:-http://ipfs:5001}
      INSTANCE_NAME: ${INSTANCE_NAME:-ServiceOps}
      COMPANY_NAME: ${COMPANY_NAME:-Your Company}
      BRAND_TEAL: ${BRAND_TEAL:-#003e4c}
      BRAND_AMBER: ${BRAND_AMBER:-#f9aa3c}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:-}
      AUDIT_INTEGRITY_KEY_FILE: ${AUDIT_INTEGRITY_KEY_FILE:-}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ALLOW_INSECURE_SESSION_COOKIES: ${ALLOW_INSECURE_SESSION_COOKIES:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVER_URI: ${LDAP_SERVER_URI:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(&(objectClass=user)(sAMAccountName={username}))}
      LDAP_START_TLS: ${LDAP_START_TLS:-true}
      LDAP_VALIDATE_CERT: ${LDAP_VALIDATE_CERT:-true}
      LDAP_CA_CERT: ${LDAP_CA_CERT:-}
      LDAP_ROLE_MAPPINGS: ${LDAP_ROLE_MAPPINGS:-{}}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      KEYCLOAK_DISCOVERY_URL: ${KEYCLOAK_DISCOVERY_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ROLE_MAPPINGS: ${KEYCLOAK_ROLE_MAPPINGS:-{}}
      KEYCLOAK_REQUIRED_ACR: ${KEYCLOAK_REQUIRED_ACR:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-ServiceOps}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      APPLE_PASSKEY_APP_ID: ${APPLE_PASSKEY_APP_ID:-}
      UPLOAD_FOLDER: /app/uploads
      LOG_DIR: /app/logs
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    volumes:
      - serviceops_uploads:/app/uploads
      - serviceops_logs:/app/logs
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # No memory ceiling existed here before: an unbounded query/leak could
    # grow until the HOST's OOM-killer intervened, taking down whatever else
    # shares the host rather than just this container. A conservative,
    # env-overridable limit turns that into a controlled, Compose-restarted
    # OOM-kill of just this service instead -- a mitigation, not a substitute
    # for real load-test evidence of the actual root cause (see BACKLOG).
    mem_limit: ${APP_MEM_LIMIT:-1g}

  worker:
    image: ${SERVICEOPS_IMAGE:?Set an immutable SERVICEOPS_IMAGE tag in .env}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    command: ["python", "-m", "tools.outbox_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-serviceops}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-serviceops}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:-}
      AUDIT_INTEGRITY_KEY_FILE: ${AUDIT_INTEGRITY_KEY_FILE:-}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-}
      DEPLOYMENT_PROFILE: production
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-bundled}
      # Deliberately NOT wired to STORAGE_MODE/IPFS_API_URL: this worker
      # is a separate process with its own in-memory IPFSStorageBackend
      # index (per the storage-mode plan's "no local index" design), so
      # two processes independently republishing checkpoints would race
      # and could clobber each other's file index. Until IPFS mode's
      # process model is consolidated (a later wave), the worker always
      # uses the default PostgresStorageBackend for any attachment it
      # touches (e.g. inbound email), even when the main app is running
      # in IPFS mode -- a known, documented first-slice limitation.
      AUTO_MIGRATE: "false"
      UPLOAD_FOLDER: /tmp/uploads
      LOG_DIR: /app/logs
    volumes:
      - serviceops_logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: ${WORKER_MEM_LIMIT:-512m}

volumes:
  serviceops_data:
    name: serviceops_postgres_data
  serviceops_uploads:
    name: serviceops_uploads
  serviceops_logs:
    name: serviceops_logs
  serviceops_ipfs_data:
    name: serviceops_ipfs_data
