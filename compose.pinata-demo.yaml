name: serviceops-pinata-demo

# Side-by-side IPFS-mode ("database-less") test stack using Pinata's free
# hosted pinning service instead of a self-hosted Kubo node -- no `ipfs`
# container at all. Mirrors compose.ipfs-demo.yaml (Kubo, port 8081)
# exactly except for the provider; both can run at the same time as the
# main compose.yaml stack (Postgres-mode, port 80).
#
# Requires a free Pinata account and JWT (pinata.cloud) in .env.pinata-demo.
# See serviceops_core/storage/pinata_client.py for how the checkpoint
# pointer works without IPNS.

services:
  app:
    image: ${SERVICEOPS_IMAGE:?Set an immutable SERVICEOPS_IMAGE tag in .env.pinata-demo}
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.pinata-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEPLOYMENT_PROFILE: production
      DEPLOYMENT_MODE: bundled
      STORAGE_MODE: ipfs
      IPFS_PROVIDER: pinata
      PINATA_JWT: ${PINATA_JWT:?Set PINATA_JWT in .env.pinata-demo -- get one free at pinata.cloud}
      PINATA_GATEWAY_URL: ${PINATA_GATEWAY_URL:?Set PINATA_GATEWAY_URL in .env.pinata-demo -- your account's dedicated gateway from the Pinata dashboard, e.g. https://your-name.mypinata.cloud}
      INSTANCE_NAME: ${INSTANCE_NAME:-ServiceOps (Pinata IPFS mode)}
      COMPANY_NAME: ${COMPANY_NAME:-Your Company}
      BRAND_TEAL: ${BRAND_TEAL:-#003e4c}
      BRAND_AMBER: ${BRAND_AMBER:-#f9aa3c}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env.pinata-demo}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:-}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-}
      LOCAL_AUTH_ENABLED: "true"
      CSRF_ENABLED: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ALLOW_INSECURE_SESSION_COOKIES: ${ALLOW_INSECURE_SESSION_COOKIES:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
      LDAP_ENABLED: "false"
      KEYCLOAK_ENABLED: "false"
      UPLOAD_FOLDER: /app/uploads
      LOG_DIR: /app/logs
      METRICS_ENABLED: "true"
    volumes:
      - serviceops_pinata_demo_uploads:/app/uploads
      - serviceops_pinata_demo_logs:/app/logs
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Same reason as compose.ipfs-demo.yaml: db.init_app()'s unused
      # sqlite fallback still needs app.instance_path to be writable.
      - /app/instance:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: ${APP_MEM_LIMIT:-1g}

volumes:
  serviceops_pinata_demo_uploads:
    name: serviceops_pinata_demo_uploads
  serviceops_pinata_demo_logs:
    name: serviceops_pinata_demo_logs
