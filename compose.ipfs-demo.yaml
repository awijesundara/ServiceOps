name: serviceops-ipfs-demo

# Side-by-side IPFS-mode ("database-less") test stack -- runs alongside
# the main compose.yaml stack (Postgres-mode, port 80) on its own project
# name, its own volumes, and port 8081, so both can be used and compared
# at the same time. Uses the same application image as the main stack;
# only the environment differs (STORAGE_MODE=ipfs).
#
# Genuinely no PostgreSQL anywhere in this file (BACKLOG B-335) -- login
# and its session/rate-limit/audit dependencies run entirely against
# IPFSStorageBackend's in-memory + IPFS-checkpoint store. IMPORTANT,
# disclosed here so it's not discovered the hard way: this is a
# login-only milestone. Tickets, the dashboard, CMDB, catalog, and every
# other ServiceOps feature still require the PostgreSQL-backed rollout
# waves described in the storage-mode plan -- they are simply not present
# in this deployment yet, not degraded. There is also no `worker` service
# here: background job processing (outbox delivery, inbound email, SLA
# sweeps, ...) is out of scope for this milestone and has no IPFS-backed
# implementation to run against.

services:
  ipfs:
    image: ipfs/kubo:v0.33.0@sha256:a11e89f0f2a620acb3e8e1c49cdce81e80115194681924a5356f301cc6b66067
    environment:
      IPFS_PROFILE: server
    volumes:
      - serviceops_ipfs_demo_ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  app:
    image: ${SERVICEOPS_IMAGE:?Set an immutable SERVICEOPS_IMAGE tag in .env.ipfs-demo}
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.ipfs-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEPLOYMENT_PROFILE: production
      DEPLOYMENT_MODE: bundled
      STORAGE_MODE: ipfs
      IPFS_API_URL: http://ipfs:5001
      INSTANCE_NAME: ${INSTANCE_NAME:-ServiceOps (IPFS mode)}
      COMPANY_NAME: ${COMPANY_NAME:-Your Company}
      BRAND_TEAL: ${BRAND_TEAL:-#003e4c}
      BRAND_AMBER: ${BRAND_AMBER:-#f9aa3c}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env.ipfs-demo}
      AUDIT_INTEGRITY_KEY: ${AUDIT_INTEGRITY_KEY:-}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-}
      LOCAL_AUTH_ENABLED: "true"
      CSRF_ENABLED: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ALLOW_INSECURE_SESSION_COOKIES: ${ALLOW_INSECURE_SESSION_COOKIES:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
      LDAP_ENABLED: "false"
      KEYCLOAK_ENABLED: "false"
      UPLOAD_FOLDER: /app/uploads
      LOG_DIR: /app/logs
      METRICS_ENABLED: "true"
    volumes:
      - serviceops_ipfs_demo_uploads:/app/uploads
      - serviceops_ipfs_demo_logs:/app/logs
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:8080"
    depends_on:
      ipfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Never actually written to: STORAGE_MODE=ipfs routes every code
      # path away from db.session/Model.query (see BACKLOG B-335). Only
      # needed because Flask-SQLAlchemy's db.init_app() unconditionally
      # tries to create app.instance_path for its (unused, default)
      # relative-sqlite-path fallback -- without this, that mkdir fails on
      # the read-only root filesystem before the app can even start.
      - /app/instance:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: ${APP_MEM_LIMIT:-1g}

volumes:
  serviceops_ipfs_demo_ipfs_data:
    name: serviceops_ipfs_demo_ipfs_data
  serviceops_ipfs_demo_uploads:
    name: serviceops_ipfs_demo_uploads
  serviceops_ipfs_demo_logs:
    name: serviceops_ipfs_demo_logs
